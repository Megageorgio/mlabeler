name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:jvmTest

  android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key (repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS)
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks" && echo "MLABELER_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - run: ./gradlew :app:assembleRelease
        env:
          MLABELER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MLABELER_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      - run: |
          V=$(grep '^app.version=' gradle.properties | cut -d= -f2)
          mv app/build/outputs/apk/release/*.apk "app/build/outputs/apk/release/mLabeler-$V-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: mLabeler-android
          path: app/build/outputs/apk/release/*.apk

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, task: packageMsi, out: "app/build/compose/binaries/main/msi/*.msi", name: windows }
          - { os: macos-latest, task: packageDmg, out: "app/build/compose/binaries/main/dmg/*.dmg", name: macos }
          - { os: ubuntu-latest, task: packageDeb, out: "app/build/compose/binaries/main/deb/*.deb", name: linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:${{ matrix.task }}
      - uses: actions/upload-artifact@v4
        with:
          name: mLabeler-${{ matrix.name }}
          path: ${{ matrix.out }}

  windows-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          V=$(grep '^app.version=' gradle.properties | cut -d= -f2)
          tools/windows-portable.sh "build/mLabeler-$V-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: mLabeler-windows-portable
          path: build/mLabeler-*-windows-x64.zip

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:linkDebugFrameworkIosSimulatorArm64 :core:iosSimulatorArm64Test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, android, desktop, windows-portable]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          prerelease: ${{ contains(github.ref, '-') }}
