name: Web UI tests (manual)

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Browser and layout to test'
        type: choice
        default: all
        options:
          - all
          - chromium-desktop
          - firefox-desktop
          - webkit-desktop
          - chromium-phone
          - webkit-phone

permissions:
  contents: read

jobs:
  build-web:
    uses: ./.github/workflows/web.yml

  ui-tests:
    needs: build-web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WEB_TEST_PROJECT: ${{ inputs.project }}
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci --prefix web
      - uses: actions/download-artifact@v4
        with:
          name: mLabeler-web
          path: app/build/outputs/web
      - name: Unpack the deployment archive for testing
        run: |
          mkdir -p app/build/web-deploy
          unzip -q app/build/outputs/web/*.zip -d app/build/web-deploy
      - name: Install browser engines
        working-directory: web
        run: |
          case "$WEB_TEST_PROJECT" in
            all) npx playwright install --with-deps chromium firefox webkit ;;
            chromium-*) npx playwright install --with-deps chromium ;;
            firefox-*) npx playwright install --with-deps firefox ;;
            webkit-*) npx playwright install --with-deps webkit ;;
            *) echo 'Unknown browser project'; exit 1 ;;
          esac
      - name: Start a virtual audio output
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=mlabeler_test rate=48000
          pactl set-default-sink mlabeler_test
          pactl list short sinks
      - name: Check layouts, editing, storage, audio and local inference
        timeout-minutes: 25
        working-directory: web
        run: |
          if [ "$WEB_TEST_PROJECT" = all ]; then
            xvfb-run -a npm run test:browsers -- --workers=2
          else
            xvfb-run -a npm run test:browsers -- --workers=2 --project="$WEB_TEST_PROJECT"
          fi
      - name: Browser test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-browser-test-results
          path: web/test-results/
          retention-days: 14
          if-no-files-found: ignore
