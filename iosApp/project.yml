# Generate the Xcode project with XcodeGen: `cd iosApp && xcodegen`
name: mLabeler
options:
  bundleIdPrefix: io.github.megageorgio
  deploymentTarget:
    iOS: "15.0"
targets:
  mLabeler:
    type: application
    platform: iOS
    sources: [iosApp]
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: mLabeler
        CFBundleShortVersionString: "0.1.0"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        NSMicrophoneUsageDescription: mLabeler records samples for voicebanks and datasets.
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.megageorgio.mlabeler
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: ["-framework", "MLabeler"]
        FRAMEWORK_SEARCH_PATHS: ["$(SRCROOT)/../app/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Build Kotlin framework
        script: |
          cd "$SRCROOT/.."
          ./gradlew :app:embedAndSignAppleFrameworkForXcode
